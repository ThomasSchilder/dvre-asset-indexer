metadata:
  name: infra-secrets
  namespace: blockscout
type: Opaque
stringData:
  DATABASE_URL: "postgresql://<username>:<password>@<service>.<namespace>.svc.cluster.local:<port>/<database>"
  REDIS_URL: "redis://:<password>@<pod>.<namespace>.svc.cluster.local:6379"
  SECRET_KEY_BASE: ""
  ETHEREUM_JSONRPC_HTTP_URL: ""
  ETHEREUM_JSONRPC_WS_URL: ""

